services:
  postgres:
    image: postgres:16-alpine
    container_name: fogon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fogon
      POSTGRES_PASSWORD: fogon
      POSTGRES_DB: fogon_pos
    ports:
      - '5434:5432'
    volumes:
      - fogon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fogon -d fogon_pos']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fogon-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - fogon_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fogon_postgres_data:
  fogon_redis_data:
