<ui-auth-layout title="Ember Restaurant" subtitle="Inicia sesión para continuar">
  <div class="mb-4 flex gap-2">
    <button
      type="button"
      class="flex-1 border px-3 py-2 text-sm"
      [class]="modo() === 'empleado' ? 'border-gray-900 font-semibold' : 'border-gray-300'"
      (click)="onCambiarModo('empleado')"
    >
      Empleado
    </button>
    <button
      type="button"
      class="flex-1 border px-3 py-2 text-sm"
      [class]="modo() === 'mesero' ? 'border-gray-900 font-semibold' : 'border-gray-300'"
      (click)="onCambiarModo('mesero')"
    >
      Mesero
    </button>
  </div>

  @if (modo() === 'empleado') {
    <ui-login-form
      [loading]="loading()"
      [errorMessage]="errorMessage()"
      (submitted)="onSubmitEmpleado($event)"
    />
  } @else {
    <ui-login-pin-form
      [loading]="loading()"
      [errorMessage]="errorMessage()"
      (submitted)="onSubmitMesero($event)"
    />
  }
</ui-auth-layout>
