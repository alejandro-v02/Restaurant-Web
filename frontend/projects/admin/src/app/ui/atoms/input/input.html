<input
  class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-600/20 disabled:cursor-not-allowed disabled:bg-slate-100"
  [id]="id()"
  [type]="type()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [disabled]="disabled"
  [value]="value"
  (input)="handleInput($event)"
  (blur)="handleBlur()"
/>
