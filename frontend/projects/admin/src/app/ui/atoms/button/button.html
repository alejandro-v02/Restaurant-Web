<button
  class="inline-flex items-center justify-center gap-2 border border-gray-300 px-4 py-2 text-sm disabled:cursor-not-allowed disabled:opacity-60"
  [class.w-full]="fullWidth()"
  [class.font-semibold]="variant() === 'primary'"
  [type]="type()"
  [disabled]="disabled() || loading()"
  (click)="onClick()"
>
  @if (loading()) {
    <span
      class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-gray-300 border-t-gray-600"
      aria-hidden="true"
    ></span>
  }
  <ng-content />
</button>
