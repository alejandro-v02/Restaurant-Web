<form class="flex flex-wrap items-end gap-3" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="w-48">
    <ui-form-field label="Categoría" inputId="producto-categoria">
      <ui-select id="producto-categoria" formControlName="categoriaId" [options]="opcionesCategoria()" />
    </ui-form-field>
  </div>

  <div class="flex-1">
    <ui-form-field label="Nombre" inputId="producto-nombre">
      <ui-input id="producto-nombre" formControlName="nombre" placeholder="Ej. Limonada de coco" />
    </ui-form-field>
  </div>

  <div class="w-32">
    <ui-form-field label="Precio" inputId="producto-precio">
      <ui-input id="producto-precio" type="text" formControlName="precio" placeholder="9000" />
    </ui-form-field>
  </div>

  <div class="w-40">
    <ui-form-field label="Impuesto" inputId="producto-impuesto">
      <ui-select id="producto-impuesto" formControlName="tipoImpuesto" [options]="opcionesTipoImpuesto" />
    </ui-form-field>
  </div>

  <ui-checkbox id="producto-enviar-cocina" label="Enviar a cocina" formControlName="enviarACocina" />

  <ui-button type="submit" [loading]="loading()">Agregar</ui-button>
</form>
