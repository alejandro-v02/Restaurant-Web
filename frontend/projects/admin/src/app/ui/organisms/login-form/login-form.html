<form class="ui-login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  @if (errorMessage()) {
    <p class="ui-login-form__alert" role="alert">{{ errorMessage() }}</p>
  }

  <ui-form-field label="Correo electrónico" inputId="login-email" [errorMessage]="emailError">
    <ui-input id="login-email" type="email" formControlName="email" autocomplete="username" />
  </ui-form-field>

  <ui-form-field label="Contraseña" inputId="login-password" [errorMessage]="passwordError">
    <ui-input id="login-password" type="password" formControlName="password" autocomplete="current-password" />
  </ui-form-field>

  <ui-button type="submit" [loading]="loading()">
    {{ loading() ? 'Ingresando…' : 'Ingresar' }}
  </ui-button>
</form>
