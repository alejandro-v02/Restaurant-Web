<form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  @if (errorMessage()) {
    <p class="border border-gray-300 p-3 text-sm text-red-600" role="alert">
      {{ errorMessage() }}
    </p>
  }

  <div class="flex flex-col gap-1.5">
    <label class="text-sm" for="login-codigo">Tu código</label>
    <ui-input id="login-codigo" formControlName="codigo" placeholder="mesero1" autocomplete="username" />
  </div>

  <div class="flex flex-col gap-1.5">
    <label class="text-sm" for="login-pin">PIN</label>
    <ui-input
      id="login-pin"
      type="password"
      inputmode="numeric"
      formControlName="pin"
      placeholder="••••"
      autocomplete="current-password"
    />
  </div>

  <ui-button type="submit" [fullWidth]="true" [loading]="loading()">
    {{ loading() ? 'Ingresando…' : 'Ingresar' }}
  </ui-button>
</form>
